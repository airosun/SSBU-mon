services:
  - type: web
    name: ssbu-mon
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SSBU_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste your Neon (or other Postgres) connection string in the Render dashboard
